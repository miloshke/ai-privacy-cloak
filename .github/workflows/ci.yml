name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # 'stable' rather than go-version-file: an old pinned toolchain hits
      # a known macOS/Xcode linker bug ("missing LC_UUID load command")
      # building race-instrumented binaries on current runner images.
      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Build
        run: go build -v ./...

      - name: Vet
        run: go vet ./...

      # The race detector needs cgo + a C toolchain; reliably available on
      # the Linux/macOS runners but not guaranteed on Windows, so Windows
      # gets a plain (still real, still exercises the actual OS service
      # mechanism below) test run instead.
      - name: Test (race)
        if: runner.os != 'Windows'
        run: go test -race ./...

      - name: Test
        if: runner.os == 'Windows'
        run: go test ./...

      - name: Leak-corpus benchmark
        run: go run ./cmd/cloak bench

  vulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Dependency and stdlib vulnerability scan
        run: govulncheck ./...

  service-integration:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      # A GitHub-hosted Linux runner has no logged-in user session by
      # default, so systemctl --user has nothing to talk to - enabling
      # linger starts one. If this ever stops working on a given runner
      # image, the test itself skips cleanly rather than failing the job.
      - name: Enable user systemd session
        if: runner.os == 'Linux'
        run: |
          sudo loginctl enable-linger "$(whoami)" || true
          echo "XDG_RUNTIME_DIR=/run/user/$(id -u)" >> "$GITHUB_ENV"

      # Runs the real OS-native background-service path end to end
      # (systemd --user on Linux, the Run registry key on Windows) rather
      # than just cross-compiling it - internal/service/service_linux_test.go
      # and service_windows_test.go skip cleanly if the runner's
      # environment can't support a user systemd session, so this job
      # reports what it could actually verify either way.
      - name: Service install/status/uninstall (real OS mechanism)
        run: go test -v ./internal/service/...
